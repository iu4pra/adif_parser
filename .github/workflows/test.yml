name: Run Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - master
      - dev
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  unit_testing:
    if: |
      github.event.pull_request.draft == false &&
      (
        github.base_ref != 'dev' ||
        github.event.pull_request.head.repo.full_name != github.repository
      )

    strategy:
      matrix:
          os: [ubuntu-latest, windows-latest, macos-latest]
          python-version: ['3.9', '3.x']

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest
      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.x'
        run: |
          pytest \
            --cov=. \
            --cov-report term-missing \
            --cov-report html:htmlcov \
            --cov-report xml:coverage.xml
      - name: Upload HTML coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 10
      # Fork tokens cannot post PR comments; tests and coverage artifacts still run.
      - name: Get Cover
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.x' && github.event.pull_request.head.repo.full_name == github.repository
        uses: orgoro/coverage@v3.3.1
        with:
            coverageFile: ./coverage.xml
            title: "Python Code Coverage"
            thresholdAll: 0.7
            thresholdNew: 0.85
            thresholdModified: 0.75
            token: ${{ secrets.GITHUB_TOKEN }}
