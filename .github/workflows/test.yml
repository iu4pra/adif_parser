name: Run Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    types: ['opened', 'edited', 'reopened', 'synchronize', 'ready_for_review']
    branches:
      - master
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_testing:
    strategy:
      matrix:
          os: [ubuntu-latest, windows-latest] # [ubuntu-latest, windows-latest, macos-latest]
          python-version: ['3.9', '3.x']

    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Playwright
        run: |
          playwright install

      - name: Unit Test - General
        run: python -m unittest unit_test.py

      - name: Unit Test - ADIF parser
        run: python -m unittest test_adif.py

      - name: Unit Test - QSO class
        run: python -m unittest test_qso.py

      - name: Unit Test - QSL generator
        run: python -m unittest test_qsl_generator.py

      - name: Unit Test - Playwright wrapper
        run: python -m unittest test_playwright_wrapper.py
