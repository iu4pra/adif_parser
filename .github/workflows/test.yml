name: Run Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - master
      - dev
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  unit_testing:
    # Only skip draft PRs. The previous condition also skipped PRs that target
    # `dev` from branches of this repository, so the tests never ran on the
    # normal `feature -> dev` flow. A required check that is skipped like that
    # either never reports or gives a false green, so the condition was removed.
    if: github.event.pull_request.draft == false

    strategy:
      matrix:
          os: [ubuntu-latest, windows-latest, macos-latest]
          python-version: ['3.9', '3.x']

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest
      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.x'
        run: |
          pytest \
            --cov=. \
            --cov-report term-missing \
            --cov-report html:htmlcov \
            --cov-report xml:coverage.xml
      - name: Upload HTML coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 10
      # Fork tokens cannot post PR comments; tests and coverage artifacts still run.
      - name: Get Cover
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.x' && github.event.pull_request.head.repo.full_name == github.repository
        uses: orgoro/coverage@v3.3.1
        with:
            coverageFile: ./coverage.xml
            title: "Python Code Coverage"
            thresholdAll: 0.7
            thresholdNew: 0.85
            thresholdModified: 0.75
            token: ${{ secrets.GITHUB_TOKEN }}

  # Single, stable status check for branch protection.
  # `unit_testing` is a matrix job: its checks are named
  # "unit_testing (<os>, <python>)", and when the job is skipped no such checks
  # exist, so requiring them directly would leave the PR stuck in "Expected".
  # This job always runs and reports one fixed name, `tests-ok`, which is the
  # only test-related check the "CI must pass" ruleset has to require.
  tests-ok:
    name: tests-ok
    needs: unit_testing
    # always(): run even when `unit_testing` fails, otherwise this job would be
    # skipped and a skipped required check is reported as passing.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Skipped is accepted (draft PRs); failure and cancellation are not.
      - name: Fail if any test job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
