name: Format Python code with Ruff

on:
  pull_request:
    branches:
      - master
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Read-only: this workflow no longer pushes commits (see the notes below).
permissions:
  contents: read

jobs:
  format:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      # The default checkout (the PR merge commit) is enough now. The former
      # `token`, `repository` and `ref` options existed only to check out the
      # PR branch so that the workflow could push formatting commits to it.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ruff
        run: pip install ruff

      # Removed: "Run ruff formatter" and "Commit and push changes if needed".
      # Commits pushed with GITHUB_TOKEN do not trigger new workflow runs, so
      # the bot's formatting commit became the PR head without any test run on
      # it, and the required checks stayed pending forever. It also rewrote
      # PR branches behind the author's back. Formatting is now only verified
      # (for every PR, forks included); fix a failure locally with
      # `ruff format .` and push.
      - name: Check formatting
        run: ruff format --check --diff .

      - name: Run ruff linter
        run: ruff check --output-format=github .
